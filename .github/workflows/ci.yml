name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Testes
        run: python -m pytest -q
      - name: Evals de atendimento (offline)
        run: python -m evals.rodar --offline
      - name: Evals de documentos (offline)
        run: python -m evals.rodar_documentos --offline
