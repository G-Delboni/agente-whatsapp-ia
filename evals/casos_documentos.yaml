# Casos de eval do assistente de documentos (nível 2). Tudo FICTÍCIO: empresas, pessoas, CNPJ e CPF.
# Os arquivos ficam em evals/documentos_exemplo/ (gerados por: python -m scripts.gerar_documentos_exemplo).
# Campos:
#   id          identificador curto
#   arquivo     nome do arquivo em documentos_exemplo/
#   cliente     id do cliente em checklist_documentos.yaml (monta o painel "o que falta")
#   esperado    campos conferidos; omitido = não checar
#     origem              xml-nfelib | xml-simples | claude
#     legivel             true/false
#     categoria           nota_fiscal_produto | nota_fiscal_servico | cupom_fiscal | recibo | boleto |
#                         extrato_bancario | outro
#     data_emissao        AAAA-MM-DD
#     documento_emitente  só dígitos
#     valor_total         número (tolerância de R$ 0,01)
#     revisar             true = precisa cair na coluna "revisar"
#     motivo_contem       trecho que precisa aparecer nos motivos de revisão
#     usou_sonnet         true/false: roteamento Haiku → Sonnet no caso ambíguo
# Relógio fixo: 2026-11-11 (competência dos documentos: outubro/2026).

# ---------- XML de NF-e (sem IA, custo zero) ----------
- id: xml_nfe_papelaria
  arquivo: nfe_01_papelaria.xml
  cliente: padaria-pao-bom
  esperado: {origem: xml-nfelib, categoria: nota_fiscal_produto, data_emissao: "2026-10-15",
             documento_emitente: "90512345000117", valor_total: 70.00, revisar: false}

- id: xml_nfe_com_frete
  arquivo: nfe_02_atacado_com_frete.xml
  cliente: padaria-pao-bom
  # total = produtos (300) + frete (20); a soma dos itens é conferida contra os produtos
  esperado: {origem: xml-nfelib, categoria: nota_fiscal_produto, valor_total: 320.00, revisar: false}

- id: xml_nfce_cnpj_invalido
  arquivo: nfe_03_cupom_cnpj_invalido.xml
  cliente: padaria-pao-bom
  esperado: {origem: xml-nfelib, categoria: cupom_fiscal, valor_total: 45.90, revisar: true,
             motivo_contem: CNPJ inválido}

